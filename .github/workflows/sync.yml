name: Sync Releases

on:
  schedule:
    - cron: '0 * * * *'  # Runs at minute 0 of every hour
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beehive-extracts
        uses: actions/checkout@v4

      - name: Checkout beehive-markdown
        uses: actions/checkout@v4
        with:
          repository: marcus-crane/beehive-markdown
          path: markdown-repo
          token: ${{ secrets.MARKDOWN_REPO_PAT }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install beehive-exports
        run: go install github.com/marcus-crane/beehive-exporter/cmd/beehive-exports@v0.0.1

      - name: Index latest releases
        run: beehive-exports archive --pages 2
        env:
          BROWSERLESS_URL: ${{ secrets.BROWSERLESS_URL }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}

      - name: Fetch new releases
        run: beehive-exports fetch
        env:
          BROWSERLESS_URL: ${{ secrets.BROWSERLESS_URL }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}

      - name: Process releases
        run: beehive-exports process

      - name: Commit raw + JSON
        run: |
          git config user.name "Helper Bot"
          git config user.email "helper@utf9k.net"
          git add raw/ json/ discovery-index/ index.json url-index.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Build commit message from staged changes
          ADDED=$(git diff --staged --numstat | wc -l | xargs)
          INSERTIONS=$(git diff --staged --shortstat | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo "0")
          DELETIONS=$(git diff --staged --shortstat | grep -oE '[0-9]+ deletion' | grep -oE '[0-9]+' || echo "0")

          # Count actual file changes
          NEW=$(git diff --staged --name-status | grep -c '^A' || true)
          MODIFIED=$(git diff --staged --name-status | grep -c '^M' || true)
          DELETED=$(git diff --staged --name-status | grep -c '^D' || true)

          MSG=""
          [ "$NEW" -gt 0 ] && MSG="${NEW} added"
          [ "$MODIFIED" -gt 0 ] && MSG="${MSG:+$MSG, }${MODIFIED} modified"
          [ "$DELETED" -gt 0 ] && MSG="${MSG:+$MSG, }${DELETED} removed"

          git commit -m "${MSG:-Updates}"
          git push

      - name: Copy and commit markdown
        run: |
          # Copy faceted markdown structure
          rsync -av --delete markdown/releases/ markdown-repo/releases/
          rsync -av --delete markdown/speeches/ markdown-repo/speeches/ 2>/dev/null || true
          cd markdown-repo
          git config user.name "Helper Bot"
          git config user.email "helper@utf9k.net"
          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Build commit message from staged changes
          NEW=$(git diff --staged --name-status | grep -c '^A' || true)
          MODIFIED=$(git diff --staged --name-status | grep -c '^M' || true)
          DELETED=$(git diff --staged --name-status | grep -c '^D' || true)

          MSG=""
          [ "$NEW" -gt 0 ] && MSG="${NEW} added"
          [ "$MODIFIED" -gt 0 ] && MSG="${MSG:+$MSG, }${MODIFIED} modified"
          [ "$DELETED" -gt 0 ] && MSG="${MSG:+$MSG, }${DELETED} removed"

          git commit -m "${MSG:-Updates}"
          git push
